name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    # Only linux-aarch64 builds in a container; an empty value runs on the runner itself.
    container: ${{ matrix.container }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fully static (musl), so the binary runs on any x86-64 distribution.
          - target: linux-x86_64
            runs-on: ubuntu-24.04
            gradle-flags: -Pstatic
          # Debian 12 links the binary against glibc 2.36.
          - target: linux-aarch64
            runs-on: ubuntu-24.04-arm
            container: debian:bookworm
          - target: windows-x86_64
            runs-on: windows-2025
            exe: .exe
          - target: macos-aarch64
            runs-on: macos-15
    env:
      EXE: ${{ matrix.exe }}
    steps:
      - name: Install native toolchain
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git gcc libc6-dev zlib1g-dev
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: graalvm-community
          native-image-musl: ${{ matrix.target == 'linux-x86_64' }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Test and build native binary
        run: ./gradlew test nativeTest nativeCompile generateSamples ${{ matrix.gradle-flags }}
      # Releases ship only the executable, so it must work alone in an empty folder.
      - name: Smoke-test the bare binary
        shell: bash
        run: |
          mkdir smoke && cp "build/native/nativeCompile/analysis-history${EXE}" smoke/
          cd smoke && "./analysis-history${EXE}" ../build/samples -o out.xlsx | tee out.txt
          test -s out.xlsx && grep -q ", 0 errors" out.txt
      - name: Package
        shell: bash
        run: |
          name="analysis-history-${{ matrix.target }}${EXE}"
          mkdir dist
          cp "build/native/nativeCompile/analysis-history${EXE}" "dist/$name"
          cd dist
          if [ "$RUNNER_OS" = macOS ]; then shasum -a 256 "$name" > "$name.sha256"; else sha256sum "$name" > "$name.sha256"; fi
      - uses: actions/upload-artifact@v7
        with:
          name: analysis-history-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: analysis-history-*
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
